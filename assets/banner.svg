<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Kevin Arias — Full-stack engineer">
  <defs>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', ui-monospace, 'Cascadia Code', Consolas, monospace; }
    </style>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.55" stop-color="#18181B" stop-opacity="0"/>
      <stop offset="1" stop-color="#18181B" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="1278" height="338" rx="18" fill="#18181B"/>
  <rect x="1" y="1" width="1278" height="338" rx="18" fill="url(#dots)"/>
  <rect x="1.5" y="1.5" width="1277" height="337" rx="17.5" fill="none" stroke="#27272A" stroke-width="1.5"/>

  <!-- left accent bar -->
  <rect x="72" y="96" width="4" height="148" rx="2" fill="#2563EB"/>

  <!-- kicker -->
  <text x="96" y="86" class="mono" font-size="15" letter-spacing="4" fill="#3B82F6">01 — SOFTWARE ENGINEER · COSTA RICA</text>

  <!-- name -->
  <text x="94" y="182" class="sans" font-size="92" font-weight="800" letter-spacing="-3" fill="#FAFAFA">Kevin Arias</text>

  <!-- role -->
  <text x="96" y="228" class="sans" font-size="25" font-weight="500" fill="#D4D4D8">Full-stack engineer building products end to end</text>

  <!-- divider -->
  <line x1="96" y1="266" x2="1184" y2="266" stroke="#27272A" stroke-width="1.5"/>

  <!-- tech row -->
  <text x="96" y="298" class="mono" font-size="16" letter-spacing="1.5" fill="#A1A1AA">TypeScript<tspan fill="#3F3F46">  ·  </tspan>React<tspan fill="#3F3F46">  ·  </tspan>Next.js<tspan fill="#3F3F46">  ·  </tspan>React Native<tspan fill="#3F3F46">  ·  </tspan>Node<tspan fill="#3F3F46">  ·  </tspan>GraphQL<tspan fill="#3F3F46">  ·  </tspan>PostgreSQL</text>

  <!-- right monogram -->
  <g transform="translate(1046,74)" fill="none" stroke="#2563EB" stroke-width="2" opacity="0.9">
    <rect x="0" y="0" width="120" height="120" rx="10" stroke="#27272A"/>
    <text x="60" y="82" text-anchor="middle" class="sans" font-size="62" font-weight="800" letter-spacing="-2" fill="#FAFAFA" stroke="none">KA</text>
  </g>
  <text x="1106" y="228" text-anchor="middle" class="mono" font-size="13" letter-spacing="3" fill="#52525B">EST. 2017</text>
</svg>
